name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $expected = "v" + [string]$props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne $expected) { throw "Release tag must equal $expected" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SyncWallpaper.sln
      - name: Build and test
        run: |
          dotnet build SyncWallpaper.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
          dotnet test SyncWallpaper.sln -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed" }
      - name: Verify uninstall preserves user data
        shell: pwsh
        run: ./tests/SyncWallpaper.ScriptTests/Uninstall.Tests.ps1
      - name: Build framework-dependent package
        shell: pwsh
        run: .\publish.ps1
      - name: Build self-contained package
        shell: pwsh
        run: .\publish.ps1 -SelfContained
      - name: Build current-user EXE installer
        shell: pwsh
        run: .\build-installer.ps1
      - name: Build isolated installer for lifecycle verification
        shell: pwsh
        run: .\build-installer.ps1 -OutputDirectory artifacts/installer-test-build -TestBuild
      - name: Verify installation, upgrades, refusals and data-preserving uninstall
        shell: pwsh
        run: |
          $testInstaller = @(Get-ChildItem artifacts/installer-test-build/*-setup-test.exe)
          if ($testInstaller.Count -ne 1) { throw 'Expected exactly one isolated test installer.' }
          .\tests\SyncWallpaper.ScriptTests\Installer.Tests.ps1 -InstallerPath $testInstaller[0].FullName
      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SyncWallpaper-installer-tests
          path: artifacts/installer-tests/
          if-no-files-found: ignore
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem artifacts\publish -File | Where-Object { $_.Extension -in '.zip', '.exe' } | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), $_.Path.Substring((Resolve-Path artifacts\publish).Path.Length + 1) } |
            Set-Content artifacts\publish\SHA256SUMS.txt -Encoding ASCII
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncWallpaper-release
          path: |
            artifacts/publish/*.zip
            artifacts/publish/*-setup.exe
            artifacts/publish/*.sha256
            artifacts/publish/SHA256SUMS.txt
            CHANGELOG.md
            LICENSE
            THIRD-PARTY-NOTICES.md
      - name: Stage verified assets in a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "SyncWallpaper $env:RELEASE_TAG" --notes "Packages verified by the release workflow. Release notes will be finalized before publication."
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }
          } elseif (-not ($existing | ConvertFrom-Json).isDraft) {
            throw "Refusing to replace assets on a published release."
          }
          $assets = @(Get-ChildItem artifacts/publish -File | Where-Object { $_.Extension -in ".zip", ".exe", ".sha256" -or $_.Name -eq "SHA256SUMS.txt" } | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 7) { throw "Expected two ZIPs, one setup EXE, three hashes and SHA256SUMS.txt" }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Draft asset upload failed" }
