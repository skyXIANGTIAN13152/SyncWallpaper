name: ci

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SyncWallpaper.sln
      - name: Build
        run: dotnet build SyncWallpaper.sln -c Release --no-restore
      - name: Test
        run: dotnet test SyncWallpaper.sln -c Release --no-build --verbosity normal
